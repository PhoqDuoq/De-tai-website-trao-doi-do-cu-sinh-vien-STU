server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # 1. Identity Service Route
        - id: identity-service-route
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/students/**

        # 2. Listing Service Route
        - id: listing-service-route
          uri: ${LISTING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/listings/**, /api/v1/categories/**

        # 3. Interaction Service Route
        - id: interaction-service-route
          uri: ${INTERACTION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/interactions/**, /api/v1/chats/**, /api/v1/conversations/**, /api/v1/reviews/**, /api/v1/comments/**, /api/v1/favorites/**

        # 4. Transaction Service Route
        - id: transaction-service-route
          uri: ${TRANSACTION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/transactions/**, /api/v1/orders/**, /api/v1/meetups/**

        # 5. Moderation Service Route
        - id: moderation-service-route
          uri: ${MODERATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/moderation/**, /api/v1/reports/**

        # 6. Billing Service Route (Listing Fees Only)
        - id: billing-service-route
          uri: ${BILLING_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/billing/**, /api/v1/invoices/**, /api/v1/fees/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
