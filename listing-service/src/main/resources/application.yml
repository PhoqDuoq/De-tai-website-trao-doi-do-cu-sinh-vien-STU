server:
  port: 8082

spring:
  application:
    name: listing-service
  datasource:
    # Dedicated database: stu_listing_db on WampServer MySQL (Port 3306)
    # Architectural Invariant: Strict database isolation. No cross-database FKs or joins.
    # Seller references are stored as scalar seller_id (logical reference to Identity service).
    url: ${DB_LISTING_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/stu_listing_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

stu:
  security:
    internal-service-key: ${INTERNAL_SERVICE_KEY:stu-marketplace-internal-secret-key-2026}

management:
  endpoints:
    web:
      exposure:
        include: health,info
