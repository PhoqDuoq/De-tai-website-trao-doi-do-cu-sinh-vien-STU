server:
  port: 8084

spring:
  application:
    name: transaction-service
  datasource:
    # Dedicated database: stu_transaction_db on WampServer MySQL (Port 3306)
    # Architectural Invariant: Strict database isolation. No cross-database FKs or joins.
    # buyer_id, seller_id, listing_id are stored as scalar references.
    url: ${DB_TRANSACTION_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/stu_transaction_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
